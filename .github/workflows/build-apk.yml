name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      # Optional: a real release keystore, so a new APK can be installed over
      # an old one. Without these secrets the build falls back to the debug key
      # (works for sideloading, but every CI run gets a different key, so you
      # have to uninstall before installing the next build).
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice title=Signing::No ANDROID_KEYSTORE_BASE64 secret set, signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/relay-release.jks
          {
            echo "storeFile=relay-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Signing with the keystore from repo secrets."

      - name: Build APK
        run: flutter build apk --release

      - name: Package and checksum
        id: package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/relay.apk
          cd dist
          sha256sum relay.apk > SHA256SUMS
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS

      - name: Write job summary
        run: |
          {
            echo "### RELAY APK"
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo ""
            echo "Verify with \`sha256sum -c SHA256SUMS\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-apk-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # Rolling download link that always points at the newest master build:
      # https://github.com/shadycyan/relay/releases/download/latest/relay.apk
      - name: Publish rolling build
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: "false"
          body: |
            Automatic build of `${{ github.sha }}` from `master`.

            sha256: `${{ steps.package.outputs.sha256 }}`
          files: |
            dist/relay.apk
            dist/SHA256SUMS

      # Tag a commit (git tag v1.0.0 && git push --tags) for a real release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            sha256: `${{ steps.package.outputs.sha256 }}`
          files: |
            dist/relay.apk
            dist/SHA256SUMS
